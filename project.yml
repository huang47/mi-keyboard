name: Boshiamy
options:
  bundleIdPrefix: com.shh
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    CODE_SIGN_STYLE: Automatic
    CURRENT_PROJECT_VERSION: 19
    MARKETING_VERSION: "1.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEVELOPMENT_TEAM: ""
targets:
  Boshiamy:
    type: application
    platform: iOS
    sources:
      - App
      - Shared
      - KeyboardUI
      - path: Resources
        excludes: [boshiamy.json]
    dependencies:
      - target: BoshiamyKeyboard
        embed: true
    info:
      path: App/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: NO
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shh.boshiamy
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: 米鍵盤
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
  BoshiamyKeyboard:
    type: app-extension
    platform: iOS
    sources:
      - Keyboard
      - Shared
      - KeyboardUI
      - path: Resources
        excludes: [boshiamy.json]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shh.boshiamy.keyboard
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
    info:
      path: Keyboard/Info.plist
      properties:
        CFBundleDisplayName: 米鍵盤
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.keyboard-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).KeyboardViewController
          NSExtensionAttributes:
            IsASCIICapable: YES
            PrefersRightToLeft: NO
            PrimaryLanguage: zh-Hant
            RequestsOpenAccess: NO
  BoshiamyTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests/CoreTests.swift, Tests/PerformanceTests.swift, Tests/NativeEnglishKeyFrames.json, Shared, KeyboardUI, Resources]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.shh.boshiamy.tests
  BoshiamyUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [Tests/UITests.swift, Tests/NativeEnglishKeyFrames.json]
    dependencies:
      - target: Boshiamy
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.shh.boshiamy.uitests
schemes:
  Boshiamy:
    build:
      targets:
        Boshiamy: all
    test:
      targets: [BoshiamyTests, BoshiamyUITests]
